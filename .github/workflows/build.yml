name: Build APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned for F-Droid reproducibility: F-Droid rebuilds the fdroid-flavor
          # APK and diffs it byte-for-byte against the signed release asset, so the
          # toolchain must be fixed (a floating `channel: stable` would break it).
          # Keep this EQUAL to the .flutter submodule commit referenced by the
          # fdroiddata recipe; bump both together when upgrading Flutter.
          flutter-version: 3.47.6
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Flutter pub packages
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Dependencies
        run: flutter pub get

      - name: Set up signing
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using keystore from secrets"
            echo "$KEYSTORE_B64" | base64 -d > android/app/bikram_signer.p12
            ACTUAL_PASS="$KS_PASS"
            ACTUAL_ALIAS="$K_ALIAS"
            ACTUAL_FILE="bikram_signer.p12"
          else
            echo "Setting up persistent release keystore"
            ACTUAL_FILE="release.jks"
            ACTUAL_PASS="obtainx_release_pass"
            ACTUAL_ALIAS="obtainx"
            if [ ! -f "android/app/$ACTUAL_FILE" ]; then
              echo "Generating permanent release keystore..."
              keytool -genkeypair -v \
                -keystore "android/app/$ACTUAL_FILE" \
                -alias "$ACTUAL_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$ACTUAL_PASS" \
                -keypass "$ACTUAL_PASS" \
                -dname "CN=ObtainX, OU=Mobile, O=ObtainX, L=World, ST=Global, C=US"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "android/app/$ACTUAL_FILE"
              git commit -m "chore: persist release signing keystore for consistent APK releases [skip ci]" || true
              git push origin HEAD:${{ github.ref_name }} || true
            else
              echo "Permanent release keystore already exists. Reusing existing key."
            fi
          fi

          cat > android/key.properties <<PROPS
          storePassword=$ACTUAL_PASS
          keyPassword=$ACTUAL_PASS
          keyAlias=$ACTUAL_ALIAS
          storeFile=$ACTUAL_FILE
          PROPS

          echo "SIGNING_KS_FILE=$ACTUAL_FILE" >> $GITHUB_ENV
          echo "SIGNING_PASS=$ACTUAL_PASS" >> $GITHUB_ENV
          echo "SIGNING_ALIAS=$ACTUAL_ALIAS" >> $GITHUB_ENV
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep -oP "^version: [^\+]+" pubspec.yaml | tail -c +10)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Normal flavor: gradle-signed, public GitHub download with in-app self-update enabled.
      # F-Droid flavor: must be reproducible and apksigcopier-compatible.
      # build-tools >= 35 apksigner forcibly rewrites alignment padding, which breaks
      # F-Droid's apksigcopier because the signature cannot be transplanted onto
      # F-Droid's rebuild. Per the apksigcopier README, the fix is to build unsigned,
      # apply the same apksigner-style padding F-Droid applies with reproducible-apk-tools
      # zipalign.py --pad-like-apksigner pinned to the fdroiddata recipe version, then sign
      # with --alignment-preserved so apksigner keeps that exact padding. The Gradle build-id
      # strip already makes the .so byte-identical to F-Droid's build.
      #
      # zipalign.py is a vendored, reviewed copy of reproducible-apk-tools' zipalign.py,
      # pinned to commit 719c3471, the exact version F-Droid's recipe uses. It is committed
      # and auditable in this repo, not downloaded at build time.
      - name: Build APKs
        run: |
          set -e
          APK_DIR=build/app/outputs/flutter-apk
          VERSION=${{ steps.extract_version.outputs.version }}
          BUILD_NAME="$VERSION"
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF" != refs/heads/main ]]; then
            BUILD_NAME="${VERSION}-Preview-${GITHUB_RUN_NUMBER}"
          fi

          flutter build apk --split-per-abi --flavor normal --build-name="$BUILD_NAME"
          for f in "$APK_DIR"/app-*-normal-release.apk; do
            arch=$(basename "$f" | sed -E 's/^app-(.+)-normal-release\.apk$/\1/')
            mv "$f" "$APK_DIR/ObtainX-v${VERSION}-${arch}.apk"
          done

          rm -f android/key.properties
          flutter build apk --split-per-abi --flavor fdroid -t lib/main_fdroid.dart --build-name="$BUILD_NAME"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          for f in "$APK_DIR"/app-*-fdroid-release.apk; do
            arch=$(basename "$f" | sed -E 's/^app-(.+)-fdroid-release\.apk$/\1/')
            python3 zipalign.py --page-size 16 --pad-like-apksigner --replace "$f" "$f.aln"
            mv -f "$f.aln" "$f"
            "$APKSIGNER" sign --alignment-preserved \
              --ks "android/app/$SIGNING_KS_FILE" --ks-pass "pass:$SIGNING_PASS" \
              --ks-key-alias "$SIGNING_ALIAS" --key-pass "pass:$SIGNING_PASS" "$f"
            mv "$f" "$APK_DIR/ObtainX-v${VERSION}-fdroid-${arch}.apk"
          done

          rm -f "$APK_DIR"/*.sha1 "$APK_DIR"/*.idsig
          ls -l "$APK_DIR"

      - name: Generate GitHub Artifact Attestations
        uses: actions/attest@v4
        with:
          subject-path: 'build/app/outputs/flutter-apk/ObtainX-*.apk'

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: obtainx-apks-v${{ steps.extract_version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/ObtainX-*.apk
            build/app/outputs/flutter-apk/ObtainX-*-attestation.json

      # - name: Delete Newest Preview Release
      #   shell: bash
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     set -euo pipefail
      #     newest_release_tag="$(gh release list \
      #       --limit 1 \
      #       --json tagName \
      #       --jq '.[0].tagName // empty')"
      #     if [[ "$newest_release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-Preview-[0-9]+$ ]]; then
      #       gh release delete "$newest_release_tag" --yes
      #     fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          tag_name: ${{ github.ref == 'refs/heads/main' && format('v{0}', steps.extract_version.outputs.version) || github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/ObtainX-*.apk
            build/app/outputs/flutter-apk/ObtainX-*-attestation.json
          generate_release_notes: true

      - name: Publish Rolling Preview Release
        if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}-Preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.extract_version.outputs.version }}-Preview-${{ github.run_number }}
          body: |
            > [!WARNING]
            > This is a preview build intended for testing. It may contain bugs, unfinished changes, or regressions. Do not install it if you want a stable experience.

            Back up your ObtainX data before installing and report any problems through the issue tracker.

            Built from `${{ github.ref_name }}` at commit `${{ github.sha }}`.
          prerelease: true
          make_latest: false
          draft: true
          overwrite_files: true
          files: |
            build/app/outputs/flutter-apk/ObtainX-*.apk
            build/app/outputs/flutter-apk/ObtainX-*-attestation.json
